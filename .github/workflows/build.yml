name: Build desktop bundles

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS
          - os: windows-latest
            name: Windows
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build renderer
        run: npm run build

      - name: Assemble bundle
        run: node scripts/bundle.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: psn-avatar-cart-${{ matrix.name }}
          path: desktop/release/**
          if-no-files-found: error
