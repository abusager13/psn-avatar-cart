name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Queue rather than cancel: cancelling a run mid-deploy leaves the Pages
  # deployment record dangling and every later deploy dies with
  # "Deployment cancelled".
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Stamp asset versions with the commit SHA
        run: |
          V="${GITHUB_SHA::12}"
          sed -i "s/__V__/${V}/g" site/index.html site/catalog.html site/search.html site/archive.html site/js/*.js
          grep -c "__V__" site/index.html site/js/main.js || true

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
